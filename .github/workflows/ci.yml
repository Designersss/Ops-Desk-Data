name: PBS quality checks
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pbs
          POSTGRES_PASSWORD: pbs_local
          POSTGRES_DB: pbs
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U pbs -d pbs"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://pbs:pbs_local@127.0.0.1:5432/pbs
      SESSION_SECRET: github-actions-test-only-secret-not-used-in-production-123456
      NEXT_TELEMETRY_DISABLED: '1'
      INTEGRATION_TEST_DB: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Database migration
        run: npm run db:migrate
      - name: Initial import/seed
        run: npm run db:seed
      - name: Unit and PostgreSQL integration tests
        run: npm test
      - name: TypeScript
        run: npm run typecheck
      - name: Production build
        run: npm run build
